name: Build Android APK and Publish Release

on:
  push:
    branches:
      - WebApp
    tags:
      - 'v1.0-beta*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de release'
        required: false
        default: 'v3.4.5-webapp'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Application and Sync Capacitor
        env:
          VITE_API_BASE_URL: https://hortobots-planning.onrender.com
        run: npm run mobile:build

      - name: Make Gradlew Executable
        run: chmod +x apps/web/android/gradlew

      - name: Prepare Release Keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > apps/web/android/app/hortobots-release.keystore
            echo "HORTOBOTS_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "HORTOBOTS_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "HORTOBOTS_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            # Usa a keystore fixa versionada no repositório WebApp para garantir
            # a mesma assinatura em todas as versões e evitar conflito de pacote ao atualizar.
            echo "HORTOBOTS_KEYSTORE_PASSWORD=hortobots2026" >> $GITHUB_ENV
            echo "HORTOBOTS_KEY_ALIAS=hortobots" >> $GITHUB_ENV
            echo "HORTOBOTS_KEY_PASSWORD=hortobots2026" >> $GITHUB_ENV
          fi
          echo "HORTOBOTS_KEYSTORE_FILE=hortobots-release.keystore" >> $GITHUB_ENV

      - name: Build Android Release APK (Gradle)
        run: |
          export JAVA_HOME="${JAVA_HOME_21_X64:-$JAVA_HOME}"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          cd apps/web/android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp apps/web/android/app/build/outputs/apk/release/app-release.apk release-assets/Planner-v3.4.5-webapp.apk
          ls -la release-assets/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hortobots-planning-apk
          path: release-assets/Planner-v3.4.5-webapp.apk
          retention-days: 30

      - name: Publish GitHub Release (v3.4.5-webapp)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref_name == 'WebApp' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ inputs.tag_name || 'v3.4.5-webapp' }}
          name: 'Planner WebApp v3.4.5 — Scroll Mobile Corrigido'
          prerelease: true
          files: release-assets/Planner-v3.4.5-webapp.apk
          body: |
            # Hortobots Planning — WebApp Android v3.4.5

            ### Correções v3.4.5:
            - **SCROLL MOBILE CORRIGIDO:** A causa raiz (`.cover { overflow: hidden }`) foi sobrescrita — arrastar o dedo agora scrola normalmente em modo retrato.
            - **Home retrato:** Cadernos em lista vertical com imagem GRANDE + título grande (2rem) + subtítulo. Scroll entre os cadernos funcional.
            - **Botões inferiores (retrato):** Fixos na tela, não scrollam junto com os cadernos.
            - **Botões de ação (paisagem):** Posicionados no topo DIREITO ao lado do botão de notificações, ocultos no retrato.
            - **Sem duplicatas de botões:** Nenhum botão extra no lugar errado.
            - **Tela inteira:** Mantido comportamento fullscreen imersivo no Android.
            - **Backgrounds portrait:** Verde (FLL), Vermelho (OBR), Roxo/Rosa (Under), Colorido (Home).

            ### Instalação (Android):
            1. Baixe `Planner-v3.4.5-webapp.apk` abaixo.
            2. Instale no Android (permita fontes desconhecidas se pedido).
            3. Se já tem versão anterior instalada, esta atualiza sem conflito (mesma keystore, mesmo package ID).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
