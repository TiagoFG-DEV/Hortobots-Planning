name: Build Android APK and Publish Release

on:
  push:
    branches:
      - WebApp
    tags:
      - 'v1.0-beta*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de release'
        required: false
        default: 'v3.3.2-webapp'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Application and Sync Capacitor
        env:
          VITE_API_BASE_URL: https://hortobots-planning.onrender.com
        run: npm run mobile:build

      - name: Make Gradlew Executable
        run: chmod +x apps/web/android/gradlew

      - name: Prepare Release Keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > apps/web/android/app/hortobots-release.keystore
            echo "HORTOBOTS_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "HORTOBOTS_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "HORTOBOTS_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            # Usa a keystore fixa versionada no repositório WebApp para garantir
            # a mesma assinatura em todas as versões e evitar conflito de pacote ao atualizar.
            echo "HORTOBOTS_KEYSTORE_PASSWORD=hortobots2026" >> $GITHUB_ENV
            echo "HORTOBOTS_KEY_ALIAS=hortobots" >> $GITHUB_ENV
            echo "HORTOBOTS_KEY_PASSWORD=hortobots2026" >> $GITHUB_ENV
          fi
          echo "HORTOBOTS_KEYSTORE_FILE=hortobots-release.keystore" >> $GITHUB_ENV

      - name: Build Android Release APK (Gradle)
        run: |
          export JAVA_HOME="${JAVA_HOME_21_X64:-$JAVA_HOME}"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          cd apps/web/android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp apps/web/android/app/build/outputs/apk/release/app-release.apk release-assets/Planner-v3.3.2-webapp.apk
          ls -la release-assets/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hortobots-planning-apk
          path: release-assets/Planner-v3.3.2-webapp.apk
          retention-days: 30

      - name: Publish GitHub Release (v3.3.2-webapp)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref_name == 'WebApp' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ inputs.tag_name || 'v3.3.2-webapp' }}
          name: 'Planner WebApp v3.3.2 (Offline-First)'
          prerelease: true
          files: release-assets/Planner-v3.3.2-webapp.apk
          body: |
            # Hortobots Planning — WebApp Android v3.2.0 (Offline-First)

            Versão atualizada do aplicativo Android (`.apk`) e WebApp PWA com todas as funcionalidades da **v3.2.0** e arquitetura **Offline-First**.

            ### Principais Recursos desta Versão:
            - **Sincronização Automática em Wi-Fi (IndexedDB):** Sempre que há conexão, o aplicativo atualiza e salva localmente todos os registros, testes, eventos, feedbacks, documentos oficiais, atualizações e banners.
            - **Leitura Completa Sem Internet (Incluindo PDFs):** Consulte todo o histórico e exporte relatórios em PDF mesmo sem Wi-Fi.
            - **Portal BIOGLOW e Notícias de Biologia Offline:** O Portal BIOGLOW e as últimas buscas dos feeds de biologia permanecem acessíveis sem internet.
            - **Download Sob Demanda de Imagens e Vídeos:** Mídias não são baixadas automaticamente; cada imagem/vídeo possui botão dedicado **Baixar** para salvar localmente quando houver internet.
            - **Modos v3.2.0 Completos:** Missão individual, Round Teste FLL BIOGLOW (15 missões + inspeção + discos de precisão), gráficos de assertividade e Central de Documentos.
            - **Roadmap iOS:** Estrutura Capacitor pronta para futura compilação de versão iOS.

            ### Instruções de Instalação (Android):
            1. Baixe o arquivo `Hortobots-Planning-v3.2.0-webapp.apk` abaixo no seu dispositivo Android.
            2. Toque no arquivo baixado para instalar (caso solicitado, permita a instalação de apps de fontes confiáveis).
            3. Abra o **Hortobots Planning** com internet na primeira vez para sincronizar os dados e depois utilize livremente mesmo sem Wi-Fi!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
